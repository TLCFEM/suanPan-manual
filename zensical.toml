# Zensical configuration, kept parallel to mkdocs.yml.
#
# Zensical reads this file automatically (`zensical build`) and falls back to
# mkdocs.yml when it is absent. Only settings supported by Zensical are listed
# here. MkDocs-only plugins are intentionally omitted:
#
# - mkdocs-jupyter  - Zensical does not execute or render notebooks; .ipynb
#                     files are copied to the site unchanged.
# - overwrite_math  - custom MkDocs plugin, not supported by Zensical.
# - awesome-pages   - replaced by awesome-nav, which reads the same .pages files.

[project]
site_name = "suanPan manual"
site_author = "Theodore Chang"
site_url = "https://suanpan-manual.readthedocs.io/"
copyright = "Copyright © 2017-2026 Theodore Chang"
repo_url = "https://github.com/TLCFEM/suanPan"

extra_css = ["color_scheme.css"]
extra_javascript = [
  "javascripts/mathjax.js",
  "https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?version=4.8.0&features=es6",
  "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js",
]

[project.theme]
name = "material"
variant = "classic"
features = ["navigation.tabs", "navigation.footer"]
favicon = "suanPan.svg"
logo = "suanPan.svg"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "white"
accent = "pink"
toggle = { icon = "material/lightbulb-outline", name = "Turn off the lights" }

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle = { icon = "material/lightbulb", name = "Turn on the lights" }

[project.markdown_extensions]
admonition = {}
pymdownx.arithmatex.generic = true
pymdownx.highlight = { linenums = true, anchor_linenums = true, use_pygments = true, auto_title = true }
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.critic = {}
pymdownx.details = {}
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.tilde = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.extra.version]
provider = "mike"

[project.plugins]
search = {}
minify = { minify_html = true }
awesome-nav = { filename = ".pages" }
