version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    install:
      - pip install zensical
    build:
      html:
        - zensical build
    post_build:
      # Zensical does not run MkDocs plugins; apply the math overrides first.
      - python plugins/overwrite/post_build.py site
      # Copy the built site into the directory Read the Docs publishes.
      - mkdir -p $READTHEDOCS_OUTPUT/html/
      - cp --recursive site/* $READTHEDOCS_OUTPUT/html/
