version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
    nodejs: "24"
  apt_packages:
    - doxygen
    - graphviz
    - pngquant
  jobs:
    post_install:
      - npm install -g svgo
    build:
      html:
        - zensical build
    post_build:
      - python plugins/overwrite/post_build.py site
      - svgo -rf site -o site --exclude inherit_graph.*
      - mkdir -p $READTHEDOCS_OUTPUT/html/
      - cp --recursive site/* $READTHEDOCS_OUTPUT/html/
python:
  install:
    - method: uv
      command: pip
      path: .
