version: 2

build:
  os: ubuntu-26.04
  tools:
    python: "3.14"
    nodejs: "24"
  apt_packages:
    - doxygen
    - graphviz
    - pngquant
  jobs:
    install:
      - python -m pip install uv
      - uv pip install --system .
      - asdf reshim python
    post_install:
      - npm install -g svgo
    build:
      html:
        - zensical build
    post_build:
      - python plugins/overwrite/post_build.py site
      - python plugins/scripts/optimize_svg.py site
      - mkdir -p $READTHEDOCS_OUTPUT/html/
      - cp --recursive site/* $READTHEDOCS_OUTPUT/html/
